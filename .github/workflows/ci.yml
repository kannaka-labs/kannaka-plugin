name: ci
# Sanity + version-pin checks for the plugin. (Native installer packaging lives
# in release-installers.yml and only runs on v* tags — this is the everyday gate.)
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: bash -n — syntax-check every shell script
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            if bash -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; rc=1; fi
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $rc

      - name: shell-rc — the installer writes to a file the shell actually reads
        run: bash test/shell-rc.test.sh

      - name: node --check — parse every .mjs/.js
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            if node --check "$f"; then echo "ok   $f"; else echo "FAIL $f"; rc=1; fi
          done < <(find . \( -name '*.mjs' -o -name '*.js' \) -not -path './.git/*')
          exit $rc

      - name: node --test — MCP compute tools (canonical JSON + Ed25519 golden vectors, NATS client, stdio server)
        run: node --test test/kax-compute.test.mjs

      - name: version-pin — kannaka-memory latest release + installer assets exist
        run: bash .github/scripts/check-release-assets.sh

      - name: installer checksum hard-fail (install.sh)
        run: bash tests/installer-checksum.sh

      - name: installer never deletes an existing binary on a failed re-download; busy binary replaced by rename (install.sh, #23)
        run: bash tests/installer-busy-binary.sh

  installer-win:
    # install.ps1 is Windows-specific — verify its checksum hard-fail on a real
    # Windows PowerShell, not an emulated one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: installer checksum hard-fail (install.ps1)
        shell: pwsh
        run: ./tests/installer-checksum.ps1

      # The manifest reader and the [llm] rewrite decide which binary lands on
      # disk and where `kannaka ask` points. Both are exercised against the
      # real functions, lifted out of install.ps1 rather than copied.
      - name: manifest pinning + brain config (install.ps1)
        shell: pwsh
        run: ./tests/installer-manifest.ps1
